<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="canonical" href="https://medijoy.co.kr/contact.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="메디조이 MEDIJOY">
<meta property="og:title" content="상담 신청 | 메디조이 MEDIJOY">
<meta property="og:description" content="진단명이 확정되지 않았거나 어디서부터 시작해야 할지 모르는 경우에도 편하게 문의해 주세요.">
<meta property="og:url" content="https://medijoy.co.kr/contact.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="util">
  <div class="wrap">
    <div class="util-reg">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.5 2.5 4v4c0 3.2 2.3 5.7 5.5 6.5 3.2-.8 5.5-3.3 5.5-6.5V4L8 1.5Z" stroke="#7FA8C4" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span data-i18n="util.reg"></span> <b>A-2025-01-02-06146</b>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="ru">Русский</button>
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="mn">Монгол</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</div>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 108 80" aria-hidden="true"><circle cx="21" cy="15" r="15" fill="#F4A8C4"/><circle cx="59" cy="12.5" r="15" fill="#1BA1E8"/><path d="M14 28h42v28H14a14 14 0 0 1 0-28Z" fill="#F4A8C4"/><path d="M56 28h26v28H56Z" fill="#1BA1E8"/><path d="M82 28h12a14 14 0 0 1 0 28H82Z" fill="#EAD9D2"/><rect x="28" y="56" width="28" height="24" fill="#1BA1E8"/><rect x="56" y="56" width="26" height="24" fill="#EAD9D2"/></svg>
      <span class="wordmark">MEDI<em>JOY</em></span>
    </a>
    <button class="navtoggle" type="button" aria-expanded="false" aria-label="Menu">☰</button>
    <nav class="main">
      <a href="index.html#journey" data-i18n="nav.journey"></a>
      <a href="index.html#biz" data-i18n="nav.biz"></a>
      <a href="index.html#diff" data-i18n="nav.diff"></a>
      <a href="contact.html" aria-current="page" data-i18n="nav.contact"></a>
    </nav>
    <a class="btn btn-primary" href="#consult" data-i18n="nav.cta"></a>
  </div>
</header>

<main>
  <div class="pagehead">
    <div class="wrap">
      <p class="crumb"><a href="index.html">MEDIJOY</a> · <span data-i18n="ct.crumb"></span></p>
      <h1 data-i18n="ct.title"></h1>
      <p data-i18n="ct.sub"></p>
    </div>
  </div>

  <section style="padding-block:0">
    <div class="wrap">
      <div class="formgrid">
        <aside class="formside">
          <div>
            <h3 data-i18n="ct.info.t"></h3>
            <dl>
              <div><dt data-i18n="ct.i.tel"></dt><dd>02-477-1032</dd></div>
              <div><dt data-i18n="ct.i.mob"></dt><dd>010-8565-1032</dd></div>
              <div><dt data-i18n="ct.i.mail"></dt><dd>contact@medijoy.co.kr</dd></div>
              <div><dt data-i18n="ct.i.addr"></dt><dd data-i18n="ct.i.addrv"></dd></div>
            </dl>
          </div>
          <div>
            <h3 data-i18n="ct.note.t"></h3>
            <ul>
              <li data-i18n="ct.note.1"></li>
              <li data-i18n="ct.note.2"></li>
              <li data-i18n="ct.note.3"></li>
            </ul>
          </div>
        </aside>

        <div class="formmain" id="consult">
          <h2 style="font-family:var(--serif);font-weight:500;font-size:19px;margin-bottom:6px" data-i18n="form.title"></h2>
          <p style="font-size:13px;color:var(--ink-3);margin-bottom:28px" data-i18n="form.sub"></p>

          <form id="consultForm" novalidate>
            <div class="row2">
              <div class="field">
                <label for="f-name"><span data-i18n="form.name"></span> <span class="req">*</span></label>
                <input id="f-name" name="name" required autocomplete="name">
              </div>
              <div class="field">
                <label for="f-country"><span data-i18n="form.country"></span></label>
                <select id="f-country" name="country">
                  <option value="RU">Россия</option>
                  <option value="KZ">Қазақстан</option>
                  <option value="UZ">Oʻzbekiston</option>
                  <option value="MN">Монгол</option>
                  <option value="CN">中国</option>
                  <option value="US">United States</option>
                  <option value="OTHER" data-i18n="form.other"></option>
                </select>
              </div>
            </div>

            <div class="row2">
              <div class="field">
                <label for="f-contact"><span data-i18n="form.contact"></span> <span class="req">*</span></label>
                <input id="f-contact" name="contact" required placeholder="+7 / +976 / +86 / +1 / email">
              </div>
              <div class="field">
                <label for="f-channel"><span data-i18n="form.channel"></span></label>
                <select id="f-channel" name="channel">
                  <option value="email" data-i18n="form.ch.email"></option>
                  <option value="phone" data-i18n="form.ch.phone"></option>
                  <option value="whatsapp">WhatsApp</option>
                  <option value="wechat">WeChat</option>
                  <option value="kakao">KakaoTalk</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="f-area"><span data-i18n="form.area"></span></label>
              <select id="f-area" name="area">
                <option value="critical" data-i18n="form.area.critical"></option>
                <option value="checkup" data-i18n="form.area.checkup"></option>
                <option value="wellness" data-i18n="form.area.wellness"></option>
                <option value="undecided" data-i18n="form.area.undecided"></option>
              </select>
            </div>

            <div class="field">
              <label><span data-i18n="form.docs"></span></label>
              <p class="fieldhint" data-i18n="form.docs.hint"></p>
              <div class="checkgroup">
                <label for="d-record"><input type="checkbox" id="d-record" name="docs" value="record"><span data-i18n="form.docs.1"></span></label>
                <label for="d-lab"><input type="checkbox" id="d-lab" name="docs" value="lab"><span data-i18n="form.docs.2"></span></label>
                <label for="d-imaging"><input type="checkbox" id="d-imaging" name="docs" value="imaging"><span data-i18n="form.docs.3"></span></label>
                <label for="d-none"><input type="checkbox" id="d-none" name="docs" value="none"><span data-i18n="form.docs.4"></span></label>
              </div>
            </div>

            <div class="field">
              <label for="f-note"><span data-i18n="form.note"></span></label>
              <textarea id="f-note" name="note" data-i18n-attr="placeholder|form.note.ph"></textarea>
            </div>

            <div class="paidnote">
              <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v5M10 13.6v.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              <div><b data-i18n="form.paid.t"></b><span data-i18n="form.paid.d"></span></div>
            </div>

            <label class="consent" for="f-consent">
              <input type="checkbox" id="f-consent" name="consent" required>
              <span data-i18n-html="form.consent"></span>
            </label>

            <button type="submit" class="btn btn-primary" data-i18n="form.submit"></button>
            <p class="formnote" data-i18n="form.sla"></p>

            <div class="channels">
              <p class="chanlabel" data-i18n="chan.now"></p>
              <div class="chanrow">
                <a class="chan" href="tel:+82-2-477-1032"><span class="dot"></span>02-477-1032</a>
                <a class="chan" href="mailto:contact@medijoy.co.kr"><span class="dot"></span>contact@medijoy.co.kr</a>
              </div>
              <p class="chanlabel" data-i18n="chan.soon"></p>
              <div class="chanrow">
                <span class="chan soon"><span class="dot"></span>WhatsApp <em class="soonbadge" data-i18n="chan.badge"></em></span>
                <span class="chan soon"><span class="dot"></span>微信 WeChat <em class="soonbadge" data-i18n="chan.badge"></em></span>
                <span class="chan soon"><span class="dot"></span>KakaoTalk <em class="soonbadge" data-i18n="chan.badge"></em></span>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="legal">
      <span class="co" data-i18n="ft.co"></span>
      <span data-i18n="ft.addr"></span>
      <span data-i18n="ft.reg"></span>
      <span data-i18n="ft.tour"></span>
      <span>Tel. 02-477-1032 &nbsp;·&nbsp; contact@medijoy.co.kr</span>
    </div>
    <div class="footlinks">
      <a href="index.html#journey" data-i18n="nav.journey"></a>
      <a href="index.html#biz" data-i18n="nav.biz"></a>
      <a href="contact.html" data-i18n="nav.contact"></a>
      <a href="privacy.html" data-i18n="ft.privacy"></a>
    </div>
    <p class="disclaimer" data-i18n="ft.disclaimer"></p>
  </div>
</footer>

<script src="app.js"></script>
<script>
(function(){
  var f = document.getElementById("consultForm");
  var msg = {
    bad:{ko:"성함, 연락처, 동의 항목을 확인해 주세요.",
         ru:"Проверьте имя, контакт и согласие на обработку данных.",
         zh:"请确认姓名、联系方式与同意项。",
         mn:"Нэр, холбоо барих мэдээлэл, зөвшөөрлөө шалгана уу.",
         en:"Please check your name, contact and consent."},
    pending:{ko:"현재 폼 전송이 준비 중입니다. contact@medijoy.co.kr 로 연락 주시면 바로 확인하겠습니다.",
             ru:"Отправка формы пока настраивается. Напишите на contact@medijoy.co.kr — ответим сразу.",
             zh:"表单发送功能正在准备中。请发送邮件至 contact@medijoy.co.kr，我们会立即处理。",
             mn:"Маягт илгээх холболт бэлтгэгдэж байна. contact@medijoy.co.kr рүү хандвал шууд хариулна.",
             en:"The form backend is being set up. Please email contact@medijoy.co.kr and we'll respond right away."}
  };
  f.addEventListener("submit", function(e){
    e.preventDefault();
    var lang = document.documentElement.lang, note = f.querySelector(".formnote");
    var ok = f.name.value.trim() && f.contact.value.trim() && f.consent.checked;
    var set = ok ? msg.pending : msg.bad;
    note.textContent = set[lang] || set.ko;
    note.style.color = ok ? "var(--blue)" : "var(--pink)";
  });

  var tgl = document.querySelector('.navtoggle'), nav = document.querySelector('nav.main');
  if(tgl && nav){
    tgl.addEventListener('click', function(){
      var open = tgl.getAttribute('aria-expanded')==='true';
      tgl.setAttribute('aria-expanded', String(!open));
      nav.style.cssText = open ? '' :
        'display:flex;flex-direction:column;position:absolute;top:70px;left:0;right:0;background:#08192A;padding:18px 24px;border-bottom:1px solid #1E3D57;gap:14px';
    });
  }
})();
</script>
</body>
</html>
